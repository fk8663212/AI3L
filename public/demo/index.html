<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="大稻埕英語口說教師展示：單層概念圖與 Macro／Micro 雙層圖。"><title>【範例展示・未整合正式流程】大稻埕英語口說 Demo · AI3L Speaking Lab</title><link rel="icon" href="data:,"><style>:root {
  --ink: #17263c;
  --ink-soft: #56657a;
  --paper: #fffdf9;
  --canvas: #f5f1e9;

  --brand: #b84a3a;
  --brand-dark: #8e3027;

  --gold: #e9ae54;

  --green: #2d7d68;

  --shadow: 0 18px 55px rgba(47, 38, 28, 0.11);

}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
}

body {
  margin: 0;
  color: var(--ink);
  background:
    radial-gradient(circle at 8% 5%, rgba(233, 174, 84, 0.19), transparent 28rem),
    radial-gradient(circle at 95% 90%, rgba(184, 74, 58, 0.12), transparent 31rem),
    var(--canvas);
  font-family:
    Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI",
    "Noto Sans TC", sans-serif;
}

button,
input,
textarea,
select {
  font: inherit;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

a {
  color: inherit;
}

button {
  cursor: pointer;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.landing-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: minmax(0, 1.08fr) minmax(360px, 0.92fr);
}

.landing-story {
  position: relative;
  overflow: hidden;
  min-height: 100vh;
  padding: clamp(32px, 6vw, 88px);
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  background:
    linear-gradient(150deg, rgba(24, 38, 60, 0.98), rgba(42, 57, 80, 0.94)),
    var(--ink);
  color: white;
}

.landing-story::after {
  content: "";
  position: absolute;
  width: 34rem;
  height: 34rem;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 50%;
  right: -12rem;
  bottom: -13rem;
  box-shadow:
    0 0 0 5rem rgba(255, 255, 255, 0.025),
    0 0 0 10rem rgba(255, 255, 255, 0.018);
}

.landing-brand {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  gap: 12px;
  font-weight: 750;
  letter-spacing: 0.03em;
}

.brand-mark {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 13px;
  color: var(--ink);
  background: var(--gold);
  font-weight: 900;
}

.landing-copy {
  position: relative;
  z-index: 1;
  max-width: 760px;
  margin: 70px 0;
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 22px;
  color: var(--gold);
  font-size: 0.83rem;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.landing-copy h1 {
  max-width: 720px;
  margin: 0;
  font-size: clamp(2.65rem, 6vw, 5.8rem);
  line-height: 0.97;
  letter-spacing: -0.055em;
}

.landing-copy p {
  max-width: 600px;
  margin: 30px 0 0;
  color: rgba(255, 255, 255, 0.72);
  font-size: clamp(1rem, 1.8vw, 1.28rem);
  line-height: 1.75;
}

.process-line {
  position: relative;
  z-index: 1;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 9px;
  color: rgba(255, 255, 255, 0.67);
  font-size: 0.85rem;
}

.process-line span {
  display: inline-flex;
  padding: 8px 12px;
  border: 1px solid rgba(255, 255, 255, 0.13);
  border-radius: 999px;
}

.landing-access {
  min-height: 100vh;
  padding: 32px;
  display: grid;
  place-items: center;
}

.access-card {
  width: min(100%, 480px);
  padding: clamp(28px, 5vw, 48px);
  border: 1px solid rgba(203, 191, 174, 0.76);
  border-radius: 28px;
  background: rgba(255, 253, 249, 0.92);
  box-shadow: var(--shadow);
  backdrop-filter: blur(18px);
}

.access-card h2 {
  margin: 0 0 10px;
  font-size: 2rem;
  letter-spacing: -0.035em;
}

.access-card > p {
  margin: 0 0 28px;
  color: var(--ink-soft);
  line-height: 1.6;
}

.field {
  display: grid;
  gap: 8px;
  margin-bottom: 16px;
}

.field label {
  font-size: 0.84rem;
  font-weight: 800;
}

.input,
.textarea,
.select {
  width: 100%;
  min-height: 46px;
  border: 1px solid var(--line-strong);
  border-radius: 13px;
  padding: 11px 13px;
  color: var(--ink);
  background: white;
  outline: none;
  transition:
    border-color 160ms ease,
    box-shadow 160ms ease;
}

.textarea {
  min-height: 110px;
  resize: vertical;
  line-height: 1.5;
}

.input:focus,
.textarea:focus,
.select:focus {
  border-color: var(--brand);
  box-shadow: 0 0 0 4px rgba(184, 74, 58, 0.11);
}

.code-input {
  text-transform: uppercase;
  letter-spacing: 0.13em;
  font-weight: 760;
}

.button {
  min-height: 44px;
  border: 0;
  border-radius: 13px;
  padding: 10px 17px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: white;
  background: var(--brand);
  font-weight: 800;
  text-decoration: none;
  transition:
    transform 160ms ease,
    background 160ms ease,
    opacity 160ms ease;
}

.button:hover:not(:disabled) {
  transform: translateY(-1px);
  background: var(--brand-dark);
}

.button:disabled {
  cursor: not-allowed;
  opacity: 0.48;
}

.button.secondary {
  color: var(--ink);
  background: white;
  border: 1px solid var(--line);
}

.button.secondary:hover:not(:disabled) {
  background: #f7f3ed;
}

.button.dark {
  background: var(--ink);
}

.button.ghost {
  color: var(--ink-soft);
  background: transparent;
}

.button.full {
  width: 100%;
}

.button.compact {
  min-height: 36px;
  padding: 7px 10px;
  font-size: 0.74rem;
}

.error-banner,
.success-banner,
.info-banner {
  margin: 12px 0;
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 0.9rem;
  line-height: 1.5;
}

.error-banner {
  color: #8b1d18;
  background: #fee9e7;
  border: 1px solid #f4c5c1;
}

.success-banner {
  color: #175b49;
  background: var(--green-soft);
  border: 1px solid #b8dfd1;
}

.info-banner {
  color: #39536f;
  background: var(--blue-soft);
  border: 1px solid #cbd9ec;
}

.access-footer {
  margin-top: 24px;
  display: flex;
  justify-content: center;
  color: var(--ink-soft);
  font-size: 0.84rem;
}

.access-footer a {
  text-underline-offset: 4px;
}

/* Student workspace */
.workspace {
  height: 100vh;
  height: 100dvh;
  display: grid;
  grid-template-columns: 270px minmax(0, 1fr);
  overflow: hidden;
  background: var(--paper);
}

.stage-rail {
  position: relative;
  z-index: 5;
  height: 100%;
  min-height: 0;
  padding: 22px 18px;
  display: flex;
  flex-direction: column;
  color: white;
  background: var(--ink);
}

.rail-brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 0 5px 20px;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  font-weight: 800;
}

.rail-brand .brand-mark {
  width: 36px;
  height: 36px;
  border-radius: 11px;
}

.stage-list {
  margin: 24px 0 0;
  padding: 0;
  display: grid;
  gap: 4px;
  list-style: none;
  overflow-y: auto;
}

.stage-item {
  position: relative;
  min-height: 62px;
  padding: 9px 8px 9px 49px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  border-radius: 13px;
  color: rgba(255, 255, 255, 0.45);
}

.stage-item::before {
  content: attr(data-order);
  position: absolute;
  left: 10px;
  top: 15px;
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: 50%;
  font-size: 0.74rem;
  font-weight: 800;
}

.stage-item.completed {
  color: rgba(255, 255, 255, 0.65);
}

.stage-item.completed::before {
  content: "✓";
  color: var(--ink);
  background: var(--green-soft);
  border-color: transparent;
}

.stage-item.active {
  color: white;
  background: rgba(255, 255, 255, 0.1);
}

.stage-item.active::before {
  color: var(--ink);
  background: var(--gold);
  border-color: var(--gold);
}

.stage-item strong {
  font-size: 0.9rem;
}

.stage-item small {
  margin-top: 3px;
  color: inherit;
  font-size: 0.72rem;
}

.rail-footer {
  margin-top: auto;
  padding: 16px 7px 2px;
  color: rgba(255, 255, 255, 0.48);
  font-size: 0.72rem;
  line-height: 1.55;
}

.chat-shell {
  min-width: 0;
  min-height: 0;
  height: 100%;
  display: grid;
  grid-template-rows: auto auto auto;
  overflow-y: auto;
  overscroll-behavior-y: contain;
  scrollbar-gutter: stable;
  background:
    linear-gradient(rgba(255, 253, 249, 0.94), rgba(255, 253, 249, 0.94)),
    radial-gradient(circle at 30% 20%, var(--gold-soft), transparent 24rem);
}

.chat-header {
  position: sticky;
  z-index: 6;
  top: 0;
  min-height: 82px;
  padding: 16px clamp(18px, 4vw, 52px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 253, 249, 0.9);
  backdrop-filter: blur(14px);
}

.chat-header h1 {
  margin: 0;
  font-size: clamp(1.1rem, 2.3vw, 1.45rem);
  letter-spacing: -0.02em;
}

.chat-header p {
  margin: 4px 0 0;
  color: var(--ink-soft);
  font-size: 0.78rem;
}

.model-badge {
  flex: 0 0 auto;
  padding: 8px 11px;
  border-radius: 999px;
  color: #6a4b13;
  background: var(--gold-soft);
  border: 1px solid #edd69c;
  font-size: 0.72rem;
  font-weight: 800;
}

.chat-scroll {
  overflow: visible;
  padding: 30px clamp(18px, 8vw, 120px) 42px;
}

.chat-column {
  width: min(100%, 880px);
  margin: 0 auto;
  display: grid;
  gap: 18px;
}

.phase-intro {
  padding: 20px 22px;
  border: 1px solid #e4d9c7;
  border-left: 5px solid var(--gold);
  border-radius: 17px;
  background: #fffbf2;
  box-shadow: 0 8px 24px rgba(56, 44, 28, 0.05);
}

.phase-intro .eyebrow {
  margin-bottom: 8px;
  color: var(--brand);
  font-size: 0.7rem;
}

.phase-intro h2 {
  margin: 0;
  font-size: 1.18rem;
}

.phase-intro p {
  margin: 8px 0 0;
  color: var(--ink-soft);
  line-height: 1.65;
}

.message-row {
  display: flex;
}

.message-row.student {
  justify-content: flex-end;
}

.message-bubble {
  width: fit-content;
  max-width: min(92%, 720px);
  padding: 14px 16px;
  border-radius: 17px 17px 17px 5px;
  color: var(--ink);
  background: white;
  border: 1px solid var(--line);
  box-shadow: 0 6px 18px rgba(42, 33, 22, 0.05);
  line-height: 1.6;
}

.message-row.student .message-bubble {
  border: 0;
  border-radius: 17px 17px 5px 17px;
  color: white;
  background: var(--brand);
}

.message-meta {
  margin-top: 6px;
  color: var(--ink-soft);
  font-size: 0.68rem;
}

.message-row.student .message-meta {
  color: rgba(255, 255, 255, 0.68);
}

.chat-composer {
  padding: 15px clamp(18px, 8vw, 120px) 18px;
  border-top: 1px solid var(--line);
  background: rgba(255, 253, 249, 0.96);
}

.composer-inner {
  width: min(100%, 880px);
  margin: 0 auto;
}

.stage-panel {
  display: grid;
  gap: 14px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 18px;
  background: white;
  box-shadow: 0 -8px 30px rgba(42, 33, 22, 0.045);
}

.stage-panel-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.gate-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  color: var(--ink-soft);
  font-size: 0.8rem;
}

.gate-row.ready {
  color: var(--green);
}

.upload-drop {
  min-height: 106px;
  border: 1.5px dashed var(--line-strong);
  border-radius: 15px;
  display: grid;
  place-items: center;
  padding: 18px;
  text-align: center;
  color: var(--ink-soft);
  background: #fbf9f5;
}

.upload-drop input {
  display: none;
}

.upload-drop strong {
  color: var(--ink);
}

.upload-progress {
  display: block;
  width: min(260px, 68vw);
  height: 6px;
  margin: 12px auto 0;
  overflow: hidden;
  border-radius: 999px;
  background: #e9e2d8;
}

.upload-progress > span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--rust);
  transition: width 120ms ease-out;
}

.upload-progress.indeterminate > span {
  width: 42%;
  animation: upload-indeterminate 1.05s ease-in-out infinite;
}

@keyframes upload-indeterminate {
  from {
    transform: translateX(-105%);
  }

  to {
    transform: translateX(345%);
  }
}

.upload-cancel-button {
  display: flex;
  width: fit-content;
  margin: 10px auto 0;
}

.handdrawn-concept-card {
  width: min(100%, 520px);
}

.handdrawn-concept-link {
  display: block;
  padding: 12px;
  color: var(--ink-soft);
  text-align: center;
  text-decoration: none;
  font-size: 0.75rem;
}

.handdrawn-concept-image {
  display: block;
  width: 100%;
  height: auto;
  max-height: 300px;
  margin-bottom: 8px;
  border: 1px solid var(--line);
  border-radius: 14px;
  object-fit: contain;
  background: #fff;
}

.uploaded-image-card .artifact-card-header > div {
  display: grid;
  gap: 3px;
}

.uploaded-image-card .artifact-card-header small {
  color: var(--ink-soft);
  font-weight: 600;
}

.uploaded-image-actions {
  display: flex;
  justify-content: flex-end;
  padding-top: 10px;
  border-top: 1px solid var(--line);
}

.delete-image-confirm {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: var(--danger);
  font-size: 0.78rem;
  font-weight: 750;
}

.delete-image-confirm > div {
  display: flex;
  gap: 8px;
  flex: 0 0 auto;
}

.chip-list {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px;
  border-radius: 999px;
  color: var(--ink);
  background: var(--gold-soft);
  border: 1px solid #eed79b;
  font-size: 0.78rem;
  font-weight: 700;
}

.artifact-card {
  width: min(100%, 760px);
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: white;
  box-shadow: 0 9px 25px rgba(42, 33, 22, 0.06);
}

.artifact-card-header {
  padding: 13px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  font-size: 0.82rem;
  font-weight: 800;
}

.artifact-card-body {
  padding: 16px;
}

.artifact-image {
  width: 100%;
  max-height: 420px;
  display: block;
  object-fit: contain;
  background: #f6f2eb;
}

.annotated-image-card {
  width: min(100%, 880px);
}

.annotated-image-card .artifact-card-header > div {
  display: grid;
  gap: 3px;
}

.annotated-image-card .artifact-card-header small {
  color: var(--ink-soft);
  font-weight: 600;
}

.annotated-image-stage {
  width: 100%;
  padding: 12px;
  overflow: auto;
  text-align: center;
  line-height: 0;
  background: #f6f2eb;
}

.annotated-image-canvas {
  position: relative;
  max-width: 100%;
  display: inline-block;
}

.annotated-image-canvas > img {
  width: auto;
  height: auto;
  max-width: 100%;
  max-height: 640px;
  display: block;
}

.annotation-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.annotation-box {
  --annotation-color: #b84a3a;
  position: absolute;
  min-width: 2px;
  min-height: 2px;
  border: 2px solid var(--annotation-color);
  border-radius: 5px;
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.9),
    0 2px 9px rgba(20, 27, 40, 0.2);
}

.annotation-box > span {
  position: absolute;
  left: -2px;
  top: -2px;
  width: max-content;
  max-width: min(230px, 42vw);
  padding: 4px 6px;
  overflow: hidden;
  border-radius: 4px 4px 5px 0;
  color: white;
  background: var(--annotation-color);
  font-size: clamp(0.58rem, 1.2vw, 0.75rem);
  font-weight: 850;
  line-height: 1.1;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.annotation-box > span small {
  margin-left: 4px;
  color: rgba(255, 255, 255, 0.82);
  font-size: 0.88em;
}

.annotation-box[data-category="person"],
.annotation-legend span[data-category="person"] {
  --annotation-color: #b84a3a;
}

.annotation-box[data-category="object"],
.annotation-legend span[data-category="object"] {
  --annotation-color: #2f6da3;
}

.annotation-box[data-category="event"],
.annotation-legend span[data-category="event"] {
  --annotation-color: #7d4da3;
}

.annotation-box[data-category="place"],
.annotation-legend span[data-category="place"] {
  --annotation-color: #2f7d65;
}

.annotation-box[data-category="feeling"],
.annotation-legend span[data-category="feeling"] {
  --annotation-color: #bd6f21;
}

.annotation-box[data-category="quality"],
.annotation-legend span[data-category="quality"] {
  --annotation-color: #82621b;
}

.annotation-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.annotation-legend span {
  padding: 5px 8px;
  border-left: 4px solid var(--annotation-color);
  border-radius: 6px;
  color: var(--ink-soft);
  background: #f7f3ed;
  font-size: 0.7rem;
  line-height: 1.3;
}

.review-list {
  display: grid;
  gap: 9px;
}

.review-item {
  padding: 12px;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 10px;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #fffdfa;
}

.review-item p {
  margin: 4px 0 0;
  color: var(--ink-soft);
  font-size: 0.78rem;
}

.decision-group {
  display: inline-flex;
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
}

.decision-group button {
  min-height: 34px;
  border: 0;
  border-right: 1px solid var(--line);
  padding: 6px 9px;
  color: var(--ink-soft);
  background: white;
  font-size: 0.73rem;
}

.decision-group button:last-child {
  border-right: 0;
}

.decision-group button.selected {
  color: white;
  background: var(--ink);
}

.concept-graph {
  position: relative;
  width: 100%;
  height: clamp(480px, 62vw, 680px);
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 15px;
  background:
    linear-gradient(90deg, rgba(203, 191, 174, 0.14) 1px, transparent 1px),
    linear-gradient(rgba(203, 191, 174, 0.14) 1px, transparent 1px);
  background-size: 18px 18px;
}

.concept-edge-layer {
  position: absolute;
  z-index: 1;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.concept-edge-layer marker path {
  fill: #768092;
}

.concept-edge-layer line {
  stroke: #768092;
  stroke-width: 0.45;
  vector-effect: non-scaling-stroke;
}

.concept-edge-layer g.ai line {
  stroke: #b18325;
  stroke-dasharray: 2 1.4;
}

.concept-edge-layer g.ai marker path {
  fill: #b18325;
}

.concept-edge-layer text {
  fill: #4c5668;
  stroke: rgba(255, 255, 255, 0.96);
  stroke-width: 0.75;
  paint-order: stroke;
  text-anchor: middle;
  font-size: 2.15px;
  font-weight: 800;
  letter-spacing: -0.03em;
}

.concept-edge-layer g.ai text {
  fill: #806019;
}

.concept-node {
  position: absolute;
  z-index: 2;
  width: clamp(92px, 16vw, 142px);
  min-height: 58px;
  padding: 9px 10px;
  display: grid;
  place-content: center;
  transform: translate(-50%, -50%);
  border: 2px solid var(--brand);
  border-radius: 14px;
  text-align: center;
  background: white;
  box-shadow: 0 7px 16px rgba(42, 33, 22, 0.08);
}

.concept-node.ai {
  border-color: var(--gold);
  background: #fffaf0;
}

.concept-node small {
  display: block;
  margin-top: 2px;
  color: var(--ink-soft);
  font-size: 0.68rem;
}

.concept-node em {
  margin-top: 4px;
  color: #8a681d;
  font-size: 0.58rem;
  font-style: normal;
  font-weight: 850;
  letter-spacing: 0.05em;
}

.concept-linear-graph {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(72px, 0.8fr) minmax(0, 1fr);
  align-items: center;
  gap: 12px;
  padding: 18px;
}

.concept-linear-graph .concept-node {
  position: static;
  grid-row: 1;
  justify-self: center;
  width: 100%;
  max-width: 120px;
  transform: none;
}

.concept-linear-edge {
  grid-column: 2;
  grid-row: 1;
  position: relative;
}

.concept-linear-edge strong {
  position: absolute;
  bottom: 12px;
  left: -6px;
  right: -6px;
  color: var(--ink-soft);
  text-align: center;
  font-size: 0.7rem;
  line-height: 1.5;
}

.concept-linear-edge > span {
  display: block;
  position: relative;
  width: 100%;
  border-top: 1.5px solid #768092;
}

.concept-linear-edge > span::after {
  content: "";
  position: absolute;
  right: 0;
  top: -4px;
  width: 7px;
  height: 7px;
  border-top: 1.5px solid #768092;
  border-right: 1.5px solid #768092;
  transform: rotate(45deg);
}

.concept-map-legend {
  margin-top: 12px;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.concept-map-legend span {
  padding: 5px 8px;
  border-radius: 999px;
  font-size: 0.68rem;
  font-weight: 750;
}

.concept-map-legend span.student {
  color: #8b352b;
  background: #f9e5e1;
}

.concept-map-legend span.ai {
  color: #745514;
  background: var(--gold-soft);
}

.edge-list {
  margin-top: 14px;
  display: grid;
  gap: 6px;
  color: var(--ink-soft);
  font-size: 0.78rem;
}

.edge-list > div {
  padding: 7px 9px;
  border-left: 3px solid var(--brand);
  border-radius: 5px;
  background: #faf8f4;
}

.edge-list > div.ai {
  border-left-color: var(--gold);
}

.audio-recorder {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.record-button {
  width: 46px;
  height: 46px;
  border: 0;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: white;
  background: var(--brand);
}

.record-button.recording {
  animation: pulse 1.4s infinite;
}

@keyframes pulse {
  50% {
    box-shadow: 0 0 0 9px rgba(184, 74, 58, 0.15);
  }
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}

.spin {
  animation: spin 0.9s linear infinite;
}

.recording-time {
  min-width: 55px;
  font-variant-numeric: tabular-nums;
  font-weight: 800;
}

.upload-status {
  margin-top: 10px;
  color: var(--ink-soft);
  font-size: 0.82rem;
  line-height: 1.5;
}

.consent-card {
  padding: 22px;
  border: 1px solid #efd8a1;
  border-radius: 17px;
  background: var(--gold-soft);
}

.consent-card h3 {
  margin: 0 0 8px;
}

.consent-card p {
  margin: 0 0 16px;
  color: #66532e;
  line-height: 1.65;
}

/* Admin */
.admin-shell {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 250px minmax(0, 1fr);
  background: #f4f2ee;
}

.admin-nav {
  min-height: 100vh;
  padding: 22px 18px;
  color: white;
  background: #152238;
}

.admin-nav-list {
  margin: 28px 0 0;
  display: grid;
  gap: 5px;
}

.admin-nav button {
  width: 100%;
  min-height: 44px;
  border: 0;
  border-radius: 11px;
  padding: 9px 12px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: rgba(255, 255, 255, 0.62);
  background: transparent;
  text-align: left;
  font-weight: 700;
}

.admin-nav button.active {
  color: white;
  background: rgba(255, 255, 255, 0.1);
}

.admin-main {
  min-width: 0;
  padding: 32px clamp(20px, 4vw, 56px) 70px;
}

.admin-header {
  margin-bottom: 30px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
}

.admin-header h1 {
  margin: 0;
  font-size: 2rem;
  letter-spacing: -0.04em;
}

.admin-header p {
  margin: 6px 0 0;
  color: var(--ink-soft);
}

.metric-grid,
.card-grid {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 16px;
}

.admin-card,
.metric-card {
  border: 1px solid var(--line);
  border-radius: 17px;
  background: white;
  box-shadow: 0 8px 25px rgba(43, 34, 22, 0.045);
}

.metric-card {
  padding: 19px;
}

.metric-card span {
  color: var(--ink-soft);
  font-size: 0.78rem;
}

.metric-card strong {
  margin-top: 8px;
  display: block;
  font-size: 1.75rem;
}

.admin-card {
  padding: 20px;
}

.admin-card h2,
.admin-card h3 {
  margin-top: 0;
}

.section-stack {
  display: grid;
  gap: 18px;
}

.split-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.status-dot {
  width: 9px;
  height: 9px;
  display: inline-block;
  border-radius: 50%;
  background: #a6adb7;
}

.status-dot.good {
  background: var(--green);
}

.status-dot.bad {
  background: var(--danger);
}

.button.danger {
  color: white;
  border-color: var(--danger);
  background: var(--danger);
}

.button.danger:hover:not(:disabled) {
  border-color: #8f1f19;
  background: #8f1f19;
}

.button.danger-outline {
  color: var(--danger);
  border: 1px solid rgba(179, 38, 30, 0.35);
  background: white;
}

.button.danger-outline:hover:not(:disabled) {
  border-color: var(--danger);
  background: #fff3f1;
}

.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: white;
}

.table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.82rem;
}

.table th,
.table td {
  padding: 12px 14px;
  border-bottom: 1px solid var(--line);
  text-align: left;
  white-space: nowrap;
}

.table th {
  color: var(--ink-soft);
  background: #faf8f4;
  font-size: 0.72rem;
}

.table tr:last-child td {
  border-bottom: 0;
}

.tag {
  padding: 4px 8px;
  border-radius: 999px;
  background: var(--blue-soft);
  font-size: 0.7rem;
  font-weight: 800;
}

.task-editor-heading {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
}

.task-editor-heading h2 {
  margin-bottom: 6px;
}

.task-editor-heading p {
  margin: 0;
  color: var(--ink-soft);
  font-size: 0.82rem;
  line-height: 1.55;
}

.task-editor-form {
  margin-top: 20px;
  display: grid;
  gap: 16px;
}

.task-editor-form .field > small {
  color: var(--ink-soft);
  font-size: 0.7rem;
  line-height: 1.45;
}

.task-config-section {
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: #faf8f4;
}

.task-config-section summary {
  padding: 15px 17px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  cursor: pointer;
  list-style: none;
  background: white;
}

.task-config-section summary::-webkit-details-marker {
  display: none;
}

.task-config-section[open] summary {
  border-bottom: 1px solid var(--line);
}

.task-config-section summary > div {
  display: grid;
  gap: 3px;
}

.task-config-section summary small {
  color: var(--ink-soft);
  font-size: 0.72rem;
}

.task-stage-editor-grid {
  padding: 16px;
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.task-stage-editor-grid .field,
.task-prompt-editor-list .field {
  margin: 0;
}

.task-stage-editor-grid .field:last-child {
  grid-column: 1 / -1;
}

.task-stage-editor-grid .textarea {
  min-height: 126px;
}

.task-prompt-editor-list {
  padding: 16px;
  display: grid;
  gap: 16px;
}

.task-prompt-editor-list .field {
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}

.task-prompt-editor-list .field:last-child {
  padding-bottom: 0;
  border-bottom: 0;
}

.task-prompt-textarea {
  min-height: 190px;
  font-family: var(--font-geist-mono), "SFMono-Regular", Consolas, monospace;
  font-size: 0.76rem;
  line-height: 1.6;
  tab-size: 2;
}

.task-editor-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
}

.task-editor-actions span {
  color: var(--ink-soft);
  font-size: 0.75rem;
}

.prompt-audit-banner {
  display: flex;
  align-items: flex-start;
  gap: 10px;
}

.prompt-audit-banner svg {
  flex: 0 0 auto;
  margin-top: 2px;
}

.prompt-task-card {
  display: grid;
  gap: 18px;
}

.prompt-task-select {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 18px;
  align-items: end;
}

.prompt-task-select .field {
  margin: 0;
}

.prompt-lock-state {
  min-height: 46px;
  padding: 9px 13px;
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid #b8dfd1;
  border-radius: 13px;
  color: #175b49;
  background: var(--green-soft);
}

.prompt-lock-state div {
  display: grid;
  gap: 2px;
}

.prompt-lock-state small {
  color: #397162;
  font-size: 0.7rem;
}

.prompt-task-summary {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
}

.prompt-task-summary > div {
  min-width: 0;
  padding: 12px;
  display: grid;
  gap: 7px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #faf8f4;
}

.prompt-task-summary span {
  color: var(--ink-soft);
  font-size: 0.7rem;
  font-weight: 800;
}

.prompt-task-summary strong,
.prompt-task-summary code {
  overflow-wrap: anywhere;
  font-size: 0.78rem;
}

.prompt-context-list {
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
  list-style: none;
}

.prompt-context-list li {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  color: var(--ink-soft);
  font-size: 0.82rem;
  line-height: 1.5;
}

.prompt-context-list svg {
  flex: 0 0 auto;
  margin-top: 2px;
}

.prompt-context-list.included svg {
  color: var(--green);
}

.prompt-context-list.excluded svg {
  color: var(--brand);
}

.prompt-disclosure {
  padding: 0;
  overflow: hidden;
}

.prompt-disclosure summary {
  padding: 18px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  cursor: pointer;
  list-style: none;
}

.prompt-disclosure summary::-webkit-details-marker {
  display: none;
}

.prompt-disclosure summary div {
  display: grid;
  gap: 4px;
}

.prompt-disclosure summary small {
  color: var(--ink-soft);
  font-size: 0.75rem;
}

.prompt-disclosure[open] summary {
  border-bottom: 1px solid var(--line);
}

.prompt-disclosure > .prompt-block {
  margin: 18px;
}

.prompt-stage-layout {
  display: grid;
  grid-template-columns: 210px minmax(0, 1fr);
  gap: 18px;
  align-items: start;
}

.prompt-stage-nav,
.prompt-stage-detail {
  border: 1px solid var(--line);
  border-radius: 17px;
  background: white;
  box-shadow: 0 8px 25px rgba(43, 34, 22, 0.045);
}

.prompt-stage-nav {
  padding: 10px;
  display: grid;
  gap: 4px;
  position: sticky;
  top: 18px;
}

.prompt-stage-nav-title {
  padding: 9px 10px 13px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--ink-soft);
  font-size: 0.75rem;
  font-weight: 800;
}

.prompt-stage-nav button {
  width: 100%;
  min-height: 54px;
  border: 0;
  border-radius: 12px;
  padding: 8px;
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr);
  gap: 9px;
  align-items: center;
  color: var(--ink-soft);
  background: transparent;
  text-align: left;
}

.prompt-stage-nav button > span {
  width: 29px;
  height: 29px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  font-size: 0.72rem;
  font-weight: 800;
}

.prompt-stage-nav button div {
  min-width: 0;
  display: grid;
  gap: 2px;
}

.prompt-stage-nav button strong {
  color: inherit;
  font-size: 0.82rem;
}

.prompt-stage-nav button small {
  font-size: 0.66rem;
}

.prompt-stage-nav button:hover,
.prompt-stage-nav button.active {
  color: var(--ink);
  background: #f7f3ed;
}

.prompt-stage-nav button.active > span {
  color: white;
  background: var(--brand);
  border-color: var(--brand);
}

.prompt-stage-detail {
  min-width: 0;
  padding: 22px;
  display: grid;
  gap: 18px;
}

.prompt-stage-detail > header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 18px;
}

.prompt-stage-detail .eyebrow {
  margin: 0 0 7px;
  display: block;
  color: var(--brand);
  font-size: 0.7rem;
  font-weight: 850;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.prompt-stage-detail h2 {
  margin: 0;
}

.prompt-stage-detail header p {
  margin: 7px 0 0;
  color: var(--ink-soft);
  font-size: 0.82rem;
  line-height: 1.55;
}

.prompt-ai-tag {
  color: #6a4b13;
  background: var(--gold-soft);
}

.prompt-instruction-card {
  padding: 15px 17px;
  border: 1px solid #e4d9c7;
  border-left: 4px solid var(--gold);
  border-radius: 13px;
  background: #fffbf2;
}

.prompt-instruction-card span {
  color: var(--ink-soft);
  font-size: 0.7rem;
  font-weight: 800;
}

.prompt-instruction-card p {
  margin: 7px 0 0;
  line-height: 1.65;
}

.prompt-call-list {
  display: grid;
  gap: 16px;
}

.prompt-call-card {
  min-width: 0;
  padding: 18px;
  display: grid;
  gap: 14px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: #fcfbf8;
}

.prompt-call-heading {
  display: grid;
  grid-template-columns: 30px minmax(0, 1fr);
  gap: 10px;
  align-items: start;
}

.prompt-call-heading > span {
  width: 30px;
  height: 30px;
  display: grid;
  place-items: center;
  border-radius: 9px;
  color: white;
  background: var(--ink);
  font-size: 0.72rem;
  font-weight: 800;
}

.prompt-call-heading h3 {
  margin: 0 0 4px;
}

.prompt-call-heading p {
  margin: 0;
  color: var(--ink-soft);
  font-size: 0.78rem;
  line-height: 1.5;
}

.prompt-variable-list {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  color: var(--ink-soft);
  font-size: 0.72rem;
}

.prompt-variable-list code {
  padding: 4px 7px;
  border: 1px solid #cbd9ec;
  border-radius: 999px;
  color: #39536f;
  background: var(--blue-soft);
  font-size: 0.68rem;
}

.prompt-block {
  min-width: 0;
  overflow: hidden;
  border: 1px solid #25344d;
  border-radius: 12px;
  background: #101827;
}

.prompt-block-header {
  padding: 9px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  color: #dce7f7;
  border-bottom: 1px solid rgba(255, 255, 255, 0.1);
  background: #172238;
  font-size: 0.7rem;
}

.prompt-block-header span {
  color: #8fa2bf;
}

.prompt-block-header code {
  color: #c9d8ed;
}

.prompt-block pre {
  max-height: 360px;
  margin: 0;
  padding: 14px;
  overflow: auto;
  color: #e9eff8;
  font-family: var(--font-geist-mono), "SFMono-Regular", Consolas, monospace;
  font-size: 0.72rem;
  line-height: 1.65;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.prompt-no-ai {
  padding: 20px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
  border: 1px dashed var(--line-strong);
  border-radius: 14px;
  color: var(--ink-soft);
  background: #faf8f4;
}

.prompt-no-ai p {
  margin: 5px 0 0;
  font-size: 0.8rem;
}

.modal-backdrop {
  position: fixed;
  z-index: 50;
  inset: 0;
  padding: 24px;
  display: grid;
  place-items: center;
  background: rgba(15, 25, 41, 0.58);
}

.modal-card {
  width: min(100%, 640px);
  max-height: 88vh;
  overflow: auto;
  padding: 24px;
  border-radius: 20px;
  background: white;
  box-shadow: var(--shadow);
}

.danger-heading {
  display: flex;
  gap: 12px;
  color: var(--danger);
}

.danger-heading h2 {
  margin-bottom: 5px;
}

.danger-heading p {
  margin: 0 0 16px;
  color: var(--ink-soft);
  line-height: 1.5;
}

.delete-task-summary {
  margin: 16px 0;
  display: grid;
  gap: 7px;
}

.delete-task-summary > div {
  padding: 8px 10px;
  display: grid;
  grid-template-columns: 72px 1fr;
  gap: 10px;
  border-radius: 8px;
  background: #faf8f4;
}

.delete-task-summary dt {
  color: var(--ink-soft);
  font-size: 0.75rem;
}

.delete-task-summary dd {
  margin: 0;
  font-weight: 750;
}

.modal-actions {
  margin-top: 18px;
  display: flex;
  justify-content: flex-end;
  gap: 9px;
}

@media (max-width: 900px) {
  .landing-shell {
    grid-template-columns: 1fr;
  }

  .landing-story {
    min-height: auto;
    padding: 34px 26px 46px;
  }

  .landing-copy {
    margin: 70px 0 90px;
  }

  .landing-access {
    min-height: auto;
    padding: 55px 20px;
  }

  .workspace {
    grid-template-columns: 68px minmax(0, 1fr);
  }

  .stage-rail {
    padding: 14px 9px;
  }

  .rail-brand strong,
  .stage-item strong,
  .stage-item small,
  .rail-footer {
    display: none;
  }

  .rail-brand {
    padding: 0 6px 14px;
  }

  .stage-item {
    min-height: 50px;
    padding: 0;
  }

  .stage-item::before {
    left: 10px;
    top: 11px;
  }

  .admin-shell {
    grid-template-columns: 74px minmax(0, 1fr);
  }

  .admin-nav {
    padding: 16px 10px;
  }

  .admin-nav .rail-brand strong,
  .admin-nav button span {
    display: none;
  }

  .admin-nav button {
    justify-content: center;
    padding: 9px;
  }

  .metric-grid,
  .card-grid {
    grid-template-columns: 1fr;
  }

  .prompt-stage-layout {
    grid-template-columns: 1fr;
  }

  .task-stage-editor-grid {
    grid-template-columns: 1fr;
  }

  .task-stage-editor-grid .field:last-child {
    grid-column: auto;
  }

  .prompt-stage-nav {
    position: static;
    grid-template-columns: repeat(7, minmax(72px, 1fr));
    overflow-x: auto;
  }

  .prompt-stage-nav-title {
    display: none;
  }

  .prompt-stage-nav button {
    min-width: 72px;

/* Admin session preview and learning-record print surface */
.session-preview-page {
  min-height: 100vh;
  padding: 22px;
  background: #eceae6;
}

.session-preview-toolbar {
  position: sticky;
  z-index: 20;
  top: 12px;
  width: min(100%, 1180px);
  margin: 0 auto 18px;
  padding: 10px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: rgba(255, 255, 255, 0.94);
  box-shadow: 0 12px 35px rgba(21, 34, 56, 0.12);
  backdrop-filter: blur(12px);
}

.session-view-switcher {
  padding: 4px;
  display: flex;
  gap: 4px;
  border-radius: 12px;
  background: #eeece8;
}

.session-view-switcher a {
  min-height: 38px;
  padding: 8px 12px;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border-radius: 9px;
  color: var(--ink-soft);
  font-size: 0.82rem;
  font-weight: 800;
  text-decoration: none;
}

.session-view-switcher a.active {
  color: var(--ink);
  background: white;
  box-shadow: 0 2px 8px rgba(21, 34, 56, 0.08);
}

.session-preview-content {
  width: min(100%, 1180px);
  margin: 0 auto;
}

.session-metadata {
  margin-bottom: 14px;
  padding: 16px 18px;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  border: 1px solid var(--line);
  border-radius: 16px;
  background: white;
}

.session-metadata div {
  min-width: 0;
  display: grid;
  gap: 5px;
}

.session-metadata span {
  color: var(--ink-soft);
  font-size: 0.7rem;
  font-weight: 800;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.session-metadata strong {
  overflow-wrap: anywhere;
  font-size: 0.86rem;
}

.session-readonly-banner {
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.session-readonly-workspace {
  min-height: 720px;
  height: calc(100vh - 190px);
  border: 1px solid var(--line);
  border-radius: 18px;
  overflow: hidden;
  box-shadow: 0 18px 45px rgba(21, 34, 56, 0.12);
}

.session-readonly-workspace .chat-shell {
  height: 100%;
}

.session-preview-page .annotated-image-card .button {
  display: none;
}

.artifact-load-error {
  min-height: 160px;
  display: grid;
  place-items: center;
  border: 1px dashed #bf4a3b;
  border-radius: 12px;
  color: #8f3328;
  background: #fff4f1;
  font-weight: 800;
}

.learning-record-title {
  margin-bottom: 14px;
  padding: 28px 30px;
  border-radius: 18px;
  color: white;
  background:
    radial-gradient(circle at 90% 15%, rgba(232, 184, 83, 0.35), transparent 15rem),
    #152238;
}

.learning-record-title h1 {
  margin: 4px 0 5px;
  font-size: clamp(1.8rem, 4vw, 2.7rem);
  letter-spacing: -0.04em;
}

.learning-record-title p {
  margin: 0;
}

.learning-record-title .eyebrow {
  color: #f0ca70;
}

.learning-stage-list {
  display: grid;
  gap: 18px;
}

.learning-stage {
  border: 1px solid var(--line);
  border-radius: 18px;
  overflow: hidden;
  background: white;
  box-shadow: 0 10px 28px rgba(21, 34, 56, 0.07);
}

.learning-stage-header {
  padding: 18px 20px;
  display: flex;
  align-items: flex-start;
  gap: 14px;
  border-bottom: 1px solid var(--line);
  background: #faf8f4;
}

.learning-stage-header > span {
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: white;
  background: #b84a3a;
  font-weight: 900;
}

.learning-stage-header h2,
.learning-stage-header p {
  margin: 0;
}

.learning-stage-header h2 {
  font-size: 1.18rem;
}

.learning-stage-header p {
  margin-top: 4px;
  color: var(--ink-soft);
  font-size: 0.82rem;
}

.learning-stage-content {
  padding: 20px;
  display: grid;
  gap: 22px;
}

.learning-record-group {
  display: grid;
  gap: 12px;
}

.learning-record-group > h3 {
  margin: 0;
  color: var(--ink-soft);
  font-size: 0.78rem;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}

.learning-stage-empty {
  margin: 0;
  padding: 22px;
  color: var(--ink-soft);
}

.learning-artifact {
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fffdf9;
}

.learning-artifact.superseded {
  border-style: dashed;
  background: #f7f5f1;
}

.learning-artifact > header {
  margin-bottom: 13px;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.learning-artifact h4,
.learning-artifact small {
  margin: 0;
}

.learning-artifact small {
  color: var(--ink-soft);
}

.artifact-status-list {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 6px;
}

.tag.warning {
  color: #8a4d08;
  background: #fff1ce;
}

.session-audio-record {
  display: grid;
  gap: 10px;
}

.session-audio-record dl,
.session-evaluation dl {
  margin: 0;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 8px;
}

.session-audio-record dl > div,
.session-evaluation dl > div {
  padding: 10px;
  border-radius: 10px;
  background: #f3f1ed;
}

.session-audio-record dt,
.session-evaluation dt {
  color: var(--ink-soft);
  font-size: 0.68rem;
  font-weight: 800;
}

.session-audio-record dd,
.session-evaluation dd {
  margin: 4px 0 0;
  font-weight: 800;
}

.session-audio-record audio {
  width: 100%;
}

.session-audio-link {
  font-size: 0.82rem;
  font-weight: 800;
}

.session-transcript > p {
  margin-top: 0;
  font-size: 1rem;
  line-height: 1.75;
}

.session-transcript ol {
  margin: 12px 0 0;
  padding-left: 22px;
  display: grid;
  gap: 7px;
}

.session-transcript li {
  padding-left: 5px;
}

.session-transcript time {
  margin-right: 9px;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
  font-size: 0.72rem;
}

.session-evaluation p {
  margin: 12px 0 0;
  line-height: 1.65;
}

.session-json-fallback {
  max-width: 100%;
  margin: 0;
  padding: 12px;
  overflow: auto;
  border-radius: 10px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  color: #27364b;
  background: #f3f1ed;
  font: 0.72rem/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
}

.session-sentence-list p,
.session-message-text {
  margin: 0 0 7px;
  white-space: pre-wrap;
}

.session-filter-bar {
  padding: 16px;
  display: grid;
  grid-template-columns: minmax(220px, 1fr) minmax(200px, 0.7fr) auto;
  align-items: end;
  gap: 12px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: white;
}

.session-filter-bar .field {
  margin: 0;
}

.table-action-list {
  display: flex;
  align-items: center;
  gap: 7px;
}

.table-action-list .button {
  white-space: nowrap;
}

.table-empty-state {
  padding: 22px;
  color: var(--ink-soft);
  text-align: center;
}

.session-pagination {
  padding: 4px 2px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  color: var(--ink-soft);
  font-size: 0.8rem;
}

.session-pagination > div {
  display: flex;
  gap: 7px;
}

@media (max-width: 760px) {
  .session-preview-page {
    padding: 10px;
  }

  .session-preview-toolbar {
    position: static;
    flex-wrap: wrap;
  }

  .session-view-switcher {
    order: 3;
    width: 100%;
  }

  .session-view-switcher a {
    flex: 1;
    justify-content: center;
  }

  .session-metadata {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .session-readonly-workspace {
    height: auto;
    min-height: 0;
  }

  .learning-stage-content {
    padding: 14px;
  }

  .session-filter-bar {
    grid-template-columns: 1fr;
  }

  .session-pagination {
    align-items: flex-start;
    flex-direction: column;
  }
}

@page {
  size: A4 portrait;
  margin: 14mm;
}

@media print {
  html,
  body {
    width: auto;
    min-height: 0;
    overflow: visible !important;
    color: #111827;
    background: white !important;
  }

  body {
    print-color-adjust: exact;
    -webkit-print-color-adjust: exact;
  }

  [data-print-hidden],
  .session-preview-page button,
  .session-preview-page audio {
    display: none !important;
  }

  .session-preview-page {
    min-height: 0;
    padding: 0;
    background: white;
  }

  .session-preview-content {
    width: 100%;
    margin: 0;
  }

  .session-metadata {
    padding: 9mm 0 5mm;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 3mm 8mm;
    border: 0;
    border-bottom: 1px solid #cfd4dc;
    border-radius: 0;
  }

  .session-readonly-banner {
    margin: 4mm 0;
    padding: 3mm;
  }

  .session-readonly-workspace {
    min-height: 0;
    height: auto;
    display: block;
    overflow: visible;
    border: 0;
    border-radius: 0;
    box-shadow: none;
  }

  .session-readonly-workspace .stage-rail {
    display: none;
  }

  .session-readonly-workspace .chat-shell {
    min-height: 0;
    height: auto;
    display: block;
    overflow: visible;
    background: white;
  }

  .session-readonly-workspace .chat-header {
    position: static;
    min-height: 0;
    padding: 5mm 0;
    border-bottom: 1px solid #cfd4dc;
    background: white;
    backdrop-filter: none;
  }

  .session-readonly-workspace .chat-scroll {
    padding: 5mm 0 0;
    overflow: visible;
  }

  .session-readonly-workspace .chat-column {
    width: 100%;
  }

  .learning-record-title {
    padding: 9mm;
    border-radius: 0;
  }

  .learning-stage-list {
    gap: 5mm;
  }

  .learning-stage {
    overflow: visible;
    border-color: #cfd4dc;
    border-radius: 0;
    box-shadow: none;
  }

  .learning-stage-header {
    padding: 4mm;
  }

  .learning-stage-content {
    padding: 4mm;
    gap: 5mm;
  }

  .learning-record-group {
    display: block;
  }

  .learning-record-group > * + * {
    margin-top: 3mm;
  }

  .learning-record-group > h3 {
    break-after: avoid-page;
    page-break-after: avoid;
  }

  .learning-record-group > h3 + * {
    break-before: avoid-page;
    page-break-before: avoid;
  }

  .learning-artifact,
  .message-bubble,
  .artifact-card,
  .concept-map-card,
  .annotated-image-card,
  .session-evaluation,
  .session-transcript {
    break-inside: avoid;
  }

  .artifact-image,
  .annotated-image-stage,
  .concept-map-card,
  .concept-graph {
    max-width: 100% !important;
    max-height: 235mm;
    object-fit: contain;
  }

  .session-audio-link {
    display: inline !important;
  }

  .session-json-fallback {
    max-height: none;
    overflow: visible;
  }
}

.demo-flat-graph .concept-graph { height: 480px; }

.demo-flat-graph .concept-edge-layer text { font-size: 1.55px; }
.demo-flat-graph .edge-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.demo-flat-hint { margin: 16px 0; color: var(--ink-soft); font-size: .74rem; line-height: 1.8; }
.demo-workspace :is(button, [tabindex="0"]):focus-visible { outline: 3px solid var(--green); outline-offset: 4px; }

@media (max-width: 1100px) {
  .demo-workspace { grid-template-columns: 208px minmax(0, 1fr); }
  .demo-header { padding: 20px 24px; }
  .demo-content { padding: 28px 24px 20px; }
  .demo-rail { padding: 24px 12px; }
  .demo-intro .model-badge { display: none; }
  .demo-detail-grid { gap: 20px; }
  .demo-micro-graph .concept-node { width: 88px; font-size: .7rem; }
}
@media (max-width: 900px) {
  .demo-workspace { grid-template-columns: 1fr; }
  .demo-rail { display: none; }
  .demo-header { min-height: 82px; }
  .demo-micro-graph .concept-node { width: 108px; font-size: .79rem; }
}
@media (max-width: 600px) {
  .demo-header { padding: 16px; gap: 10px; }
  .demo-header h1 { font-size: 1rem; }
  .demo-header .demo-kicker { font-size: .49rem; }
  .demo-header .button { font-size: .65rem; white-space: nowrap; }
  .demo-content { padding: 25px 14px 20px; }
  .demo-intro h2 { font-size: 1.58rem; line-height: 1.35; }
  .demo-intro p { font-size: .78rem; }
  .demo-view-switch { width: 100%; margin: 22px 0; }
  .demo-view-switch button { flex: 1; gap: 5px; padding: 9px 7px; font-size: .7rem; }
  .demo-view-switch button svg { width: 14px; }
  .demo-new { display: none; }
  .demo-macro, .demo-micro, .demo-flat { padding: 18px 14px; border-radius: 13px; }
  .demo-section-heading { align-items: flex-start; gap: 10px; }
  .demo-section-heading h2 { font-size: 1.02rem; }
  .demo-instruction { max-width: 75px; text-align: right; font-size: .63rem; line-height: 1.8; }
  .demo-count { padding: 5px 7px; font-size: .61rem; white-space: nowrap; }
  .demo-macro-tabs { gap: 14px; margin-top: 20px; }
  .demo-macro-tabs button { min-height: 98px; padding: 11px 6px; align-items: center; text-align: center; }
  .demo-macro-tabs button[aria-selected="true"] { padding: 10px 5px; }
  .demo-macro-tabs button strong { font-size: .76rem; white-space: nowrap; }
  .demo-macro-tabs button small { font-size: .55rem; line-height: 1.5; }
  .demo-macro-order { font-size: .6rem; }
  .demo-macro-check { display: none; }
  .demo-macro-arrow { width: 13px; right: -14px; top: 39px; }
  .demo-detail-grid { grid-template-columns: 1fr; gap: 24px; }
  .demo-micro-graph .concept-graph { height: 180px; }
  .demo-micro-graph .concept-node { width: 100px; font-size: .74rem; }
  .demo-micro-graph .concept-linear-graph { padding: 12px; gap: 8px; }
  .demo-micro-graph .concept-edge-layer text { font-size: 3px; }
  .demo-scaffolds { padding: 0 2px; }
  .demo-starter > p { font-size: 1.08rem; }
  .demo-section-nav > span { display: none; }
  .demo-footer { flex-direction: column; gap: 7px; align-items: flex-start; }
}
@media (prefers-reduced-motion: reduce) {
  .demo-workspace * { transition: none !important; }
}

/* This standalone artifact is a fixed-data preview, outside the study flow. */
body.demo-preview-only { display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; }
.demo-scope-banner { flex: 0 0 auto; display: flex; align-items: center; flex-wrap: wrap; gap: 5px 14px; padding: 12px 20px; border-bottom: 1px solid #e2c884; color: #674812; background: #fff2cf; font-size: .78rem; line-height: 1.65; }
.demo-scope-banner strong { font-weight: 850; }
.demo-scope-banner span { color: #795c28; }
body.demo-preview-only #speaking-demo-root { flex: 1 1 auto; min-height: 0; }
body.demo-preview-only #speaking-demo-root .demo-workspace { height: 100%; }
@media (max-width: 600px) { .demo-scope-banner { padding: 10px 14px; font-size: .71rem; } }
